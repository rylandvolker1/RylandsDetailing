# Netlify configuration — Ryland's Mobile Detailing
# Static site, no build step: just publish the repo root.

[build]
  publish = "."

# Sensible security headers for a static site
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
